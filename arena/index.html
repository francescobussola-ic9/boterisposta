<script>


/* ======================================================
   CONFIGURAZIONE
====================================================== */

const PYODIDE_URL =
  "https://cdn.jsdelivr.net/pyodide/v314.0.3/full/pyodide.js";


const TURN_DELAY = 350;


/*
  Se un bot rimane bloccato molto a lungo
  senza raggiungere il prossimo input(),
  la partita viene fermata.

  Utile soprattutto contro while infiniti.
*/

const BOT_TIMEOUT = 8000;



/* ======================================================
   MATRICE PUNTEGGI
====================================================== */

const scores = {

  C: {

    C: [3, 3],
    A: [0, 5],
    P: [2, 1]

  },

  A: {

    C: [5, 0],
    A: [0, 0],
    P: [0, 2]

  },

  P: {

    C: [1, 2],
    A: [2, 0],
    P: [1, 1]

  }

};



/* ======================================================
   MOTORE PYTHON CHE VERRÀ CARICATO
   DENTRO CIASCUN WEB WORKER
====================================================== */

const PYTHON_ENGINE = `

import ast

from arena_bridge import (
    arena_input,
    arena_print
)



# ------------------------------------------------------
# PRINT
# ------------------------------------------------------

def __arena_print__(
    *args,
    sep=" ",
    end="\\\\n",
    file=None,
    flush=False
):

    testo = sep.join(
        str(x)
        for x in args
    )

    testo = testo + end

    arena_print(testo)



# ------------------------------------------------------
# INPUT
# ------------------------------------------------------

async def __arena_input__(
    mossa_corrente,
    prompt=""
):

    risposta = await arena_input(
        mossa_corrente,
        str(prompt)
    )

    return str(risposta)



# ------------------------------------------------------
# TRASFORMAZIONE AST
#
# input("...")
#
# diventa internamente:
#
# await __arena_input__(
#     locals().get("mossa"),
#     "..."
# )
#
# Lo studente NON deve scrivere await.
# ------------------------------------------------------

class InputTransformer(
    ast.NodeTransformer
):

    def visit_Call(self, node):

        node = self.generic_visit(node)


        if (
            isinstance(
                node.func,
                ast.Name
            )
            and
            node.func.id == "input"
        ):

            current_move = ast.Call(

                func=ast.Attribute(

                    value=ast.Call(

                        func=ast.Name(
                            id="locals",
                            ctx=ast.Load()
                        ),

                        args=[],
                        keywords=[]

                    ),

                    attr="get",
                    ctx=ast.Load()

                ),

                args=[
                    ast.Constant(
                        value="mossa"
                    )
                ],

                keywords=[]

            )


            new_call = ast.Call(

                func=ast.Name(
                    id="__arena_input__",
                    ctx=ast.Load()
                ),

                args=[
                    current_move,
                    *node.args
                ],

                keywords=node.keywords

            )


            return ast.copy_location(

                ast.Await(
                    value=new_call
                ),

                node

            )


        return node



# ------------------------------------------------------
# ESECUZIONE DEL PROGRAMMA
# ------------------------------------------------------

async def run_student_code(source):


    tree = ast.parse(
        source,
        filename="<bot>"
    )


    tree = InputTransformer().visit(
        tree
    )


    /*
      Tutto il programma dello studente
      viene inserito dentro una funzione
      asincrona invisibile.

      Il codice originale non viene
      modificato nell'editor.
    */


    main_function = ast.AsyncFunctionDef(

        name="__bot_main__",

        args=ast.arguments(

            posonlyargs=[],
            args=[],
            kwonlyargs=[],
            kw_defaults=[],
            defaults=[]

        ),

        body=tree.body,

        decorator_list=[]

    )


    module = ast.Module(

        body=[
            main_function
        ],

        type_ignores=[]

    )


    ast.fix_missing_locations(
        module
    )


    compiled = compile(

        module,

        filename="<bot>",

        mode="exec"

    )


    environment = {

        "__arena_input__":
            __arena_input__,

        "print":
            __arena_print__

    }


    exec(
        compiled,
        environment
    )


    await environment[
        "__bot_main__"
    ]()

`;



/* ======================================================
   CODICE JAVASCRIPT DI OGNI WORKER
====================================================== */

function createWorkerSource() {


  return `

    importScripts(
      ${JSON.stringify(PYODIDE_URL)}
    );


    let pyodide;

    let nextInputId = 0;

    const waitingInputs =
      new Map();



    // ==========================================
    // PONTE: PRINT
    // ==========================================

    function arenaPrint(text) {

      postMessage({

        type: "print",

        text: String(text)

      });

    }



    // ==========================================
    // PONTE: INPUT
    // ==========================================

    function arenaInput(
      move,
      prompt
    ) {

      return new Promise(
        (resolve) => {

          nextInputId++;

          const id =
            nextInputId;


          waitingInputs.set(
            id,
            resolve
          );


          postMessage({

            type:
              "input",

            id:
              id,

            move:
              move === null ||
              move === undefined
                ? null
                : String(move),

            prompt:
              String(prompt || "")

          });

        }
      );

    }



    // ==========================================
    // AVVIO PYODIDE
    // ==========================================

    async function initialize() {


      try {


        pyodide =
          await loadPyodide();



        pyodide.registerJsModule(

          "arena_bridge",

          {

            arena_input:
              arenaInput,

            arena_print:
              arenaPrint

          }

        );



        await pyodide.runPythonAsync(
          ${JSON.stringify(PYTHON_ENGINE)}
        );



        postMessage({

          type:
            "ready"

        });


      }


      catch (error) {


        postMessage({

          type:
            "fatal",

          message:
            error.message

        });

      }

    }



    initialize();



    // ==========================================
    // MESSAGGI DALL'ARENA
    // ==========================================

    self.onmessage =
      async function(event) {


        const data =
          event.data;



        // --------------------------------------
        // RISPOSTA A INPUT
        // --------------------------------------

        if (
          data.type ===
          "input-response"
        ) {


          const resolve =
            waitingInputs.get(
              data.id
            );


          if (resolve) {


            waitingInputs.delete(
              data.id
            );


            resolve(
              data.value
            );

          }


          return;

        }



        // --------------------------------------
        // AVVIA PROGRAMMA
        // --------------------------------------

        if (
          data.type ===
          "start"
        ) {


          try {


            pyodide.globals.set(
              "_student_source",
              data.code
            );


            await pyodide.runPythonAsync(
              "await run_student_code(_student_source)"
            );


            postMessage({

              type:
                "done"

            });


          }


          catch (error) {


            postMessage({

              type:
                "error",

              message:
                error.message

            });

          }

        }

      };

  `;

}



/* ======================================================
   STATO ARENA
====================================================== */

let workers = {

  1: null,
  2: null

};


let workersReady = {

  1: false,
  2: false

};


let gameActive = false;


let turn = 0;


let pendingMoves = {

  1: null,
  2: null

};


let finishedBots = {

  1: false,
  2: false

};


let score1 = 0;

let score2 = 0;


let botNames = {

  1: "Bot 1",
  2: "Bot 2"

};


let watchdog = null;



/* ======================================================
   CREA I DUE BOT
====================================================== */

function createWorkers() {


  terminateWorkers();


  workersReady = {

    1: false,
    2: false

  };


  document.getElementById(
    "play-button"
  ).disabled = true;


  const status =
    document.getElementById(
      "arena-status"
    );


  status.textContent =
    "Preparazione dei due motori Python...";


  status.classList.remove(
    "ready"
  );



  for (
    let bot = 1;
    bot <= 2;
    bot++
  ) {


    const source =
      createWorkerSource();


    const blob =
      new Blob(

        [source],

        {
          type:
            "text/javascript"
        }

      );


    const url =
      URL.createObjectURL(
        blob
      );


    const worker =
      new Worker(url);


    URL.revokeObjectURL(
      url
    );


    workers[bot] =
      worker;



    worker.onmessage =
      function(event) {

        handleWorkerMessage(
          bot,
          event.data
        );

      };


    worker.onerror =
      function(event) {

        failGame(

          "Errore nel motore del Bot " +
          bot +
          ".\\n\\n" +
          event.message

        );

      };

  }

}



/* ======================================================
   MESSAGGI DAI WORKER
====================================================== */

function handleWorkerMessage(
  bot,
  data
) {


  // ----------------------------------------
  // PRONTO
  // ----------------------------------------

  if (
    data.type === "ready"
  ) {


    workersReady[bot] =
      true;


    if (
      workersReady[1] &&
      workersReady[2]
    ) {


      const status =
        document.getElementById(
          "arena-status"
        );


      status.textContent =
        "Arena pronta ✓";


      status.classList.add(
        "ready"
      );


      document.getElementById(
        "play-button"
      ).disabled = false;

    }


    return;

  }



  // ----------------------------------------
  // PRINT
  // ----------------------------------------

  if (
    data.type === "print"
  ) {


    if (gameActive) {

      appendConsole(
        bot,
        data.text
      );

    }


    return;

  }



  // ----------------------------------------
  // INPUT
  // ----------------------------------------

  if (
    data.type === "input"
  ) {


    if (!gameActive) {
      return;
    }


    receiveMove(

      bot,

      data.id,

      data.move

    );


    return;

  }



  // ----------------------------------------
  // PROGRAMMA FINITO
  // ----------------------------------------

  if (
    data.type === "done"
  ) {


    if (!gameActive) {
      return;
    }


    finishedBots[bot] =
      true;



    /*
      Se il programma finisce prima
      di aver giocato 10 turni,
      qualcosa non va.
    */

    if (turn < 10) {


      failGame(

        botNames[bot] +
        " ha terminato il programma " +
        "dopo soltanto " +
        turn +
        " turni.\\n\\n" +
        "La partita deve durare 10 turni."

      );


      return;

    }



    if (
      finishedBots[1] &&
      finishedBots[2]
    ) {


      finishGame();

    }


    return;

  }



  // ----------------------------------------
  // ERRORE PYTHON
  // ----------------------------------------

  if (
    data.type === "error"
  ) {


    failGame(

      "Errore in " +
      botNames[bot] +
      ":\\n\\n" +
      cleanPythonError(
        data.message
      )

    );


    return;

  }



  // ----------------------------------------
  // ERRORE CARICAMENTO PYTHON
  // ----------------------------------------

  if (
    data.type === "fatal"
  ) {


    failGame(

      "Errore nel caricamento Python:\\n\\n" +
      data.message

    );

  }

}



/* ======================================================
   RICEVE LA MOSSA DA UN BOT
====================================================== */

function receiveMove(
  bot,
  inputId,
  rawMove
) {


  /*
    Dopo il decimo turno un nuovo
    input() significherebbe che il bot
    sta cercando di giocare un turno 11.
  */

  if (
    turn >= 10
  ) {


    failGame(

      botNames[bot] +
      " ha richiesto un nuovo input() " +
      "dopo il decimo turno."

    );


    return;

  }



  if (
    pendingMoves[bot] !== null
  ) {


    failGame(

      botNames[bot] +
      " ha richiesto due input() " +
      "nello stesso turno."

    );


    return;

  }



  if (
    rawMove === null ||
    rawMove === undefined
  ) {


    failGame(

      botNames[bot] +
      " è arrivato a input() senza " +
      'aver assegnato un valore a "mossa".'

    );


    return;

  }



  const move =
    String(rawMove)
      .trim()
      .toUpperCase();



  if (
    !["C", "A", "P"].includes(move)
  ) {


    failGame(

      botNames[bot] +
      ' ha scelto "' +
      move +
      '".\\n\\n' +
      'La variabile "mossa" deve essere ' +
      '"C", "A" oppure "P".'

    );


    return;

  }



  pendingMoves[bot] = {

    id:
      inputId,

    move:
      move

  };



  /*
    Se entrambi sono arrivati al proprio
    input(), il turno è completo.
  */

  if (
    pendingMoves[1] &&
    pendingMoves[2]
  ) {


    completeTurn();

  }

}



/* ======================================================
   COMPLETA UN TURNO
====================================================== */

function completeTurn() {


  clearWatchdog();


  const bot1 =
    pendingMoves[1];


  const bot2 =
    pendingMoves[2];


  pendingMoves = {

    1: null,
    2: null

  };


  turn++;



  const points =
    scores[
      bot1.move
    ][
      bot2.move
    ];



  const points1 =
    points[0];


  const points2 =
    points[1];



  score1 +=
    points1;


  score2 +=
    points2;



  addTurnToTable(

    turn,

    bot1.move,

    bot2.move,

    points1,

    points2

  );



  document.getElementById(
    "score-1"
  ).textContent =
    score1;


  document.getElementById(
    "score-2"
  ).textContent =
    score2;



  /*
    Piccola pausa visiva.

    Poi ciascun input() riceve
    la mossa dell'altro bot.
  */

  setTimeout(
    function() {


      if (!gameActive) {
        return;
      }


      workers[1].postMessage({

        type:
          "input-response",

        id:
          bot1.id,

        value:
          bot2.move

      });



      workers[2].postMessage({

        type:
          "input-response",

        id:
          bot2.id,

        value:
          bot1.move

      });



      armWatchdog();


    },

    TURN_DELAY

  );

}



/* ======================================================
   AVVIA PARTITA
====================================================== */

function playGame() {


  if (
    !workersReady[1] ||
    !workersReady[2]
  ) {

    return;

  }



  resetVisuals();



  botNames[1] =
    document.getElementById(
      "bot1-name"
    ).value.trim()
    || "Bot 1";


  botNames[2] =
    document.getElementById(
      "bot2-name"
    ).value.trim()
    || "Bot 2";



  const code1 =
    document.getElementById(
      "bot1-code"
    ).value;


  const code2 =
    document.getElementById(
      "bot2-code"
    ).value;



  document.getElementById(
    "score-name-1"
  ).textContent =
    botNames[1].toUpperCase();


  document.getElementById(
    "score-name-2"
  ).textContent =
    botNames[2].toUpperCase();


  document.getElementById(
    "table-name-1"
  ).textContent =
    botNames[1];


  document.getElementById(
    "table-name-2"
  ).textContent =
    botNames[2];


  document.getElementById(
    "console-name-1"
  ).textContent =
    botNames[1].toUpperCase();


  document.getElementById(
    "console-name-2"
  ).textContent =
    botNames[2].toUpperCase();



  gameActive =
    true;


  turn =
    0;


  score1 =
    0;


  score2 =
    0;


  pendingMoves = {

    1: null,
    2: null

  };


  finishedBots = {

    1: false,
    2: false

  };



  document.getElementById(
    "play-button"
  ).disabled =
    true;



  document.getElementById(
    "console-section"
  ).classList.remove(
    "hidden"
  );


  document.getElementById(
    "results"
  ).classList.remove(
    "hidden"
  );



  workers[1].postMessage({

    type:
      "start",

    code:
      code1

  });



  workers[2].postMessage({

    type:
      "start",

    code:
      code2

  });



  armWatchdog();

}



/* ======================================================
   TABELLA
====================================================== */

function addTurnToTable(
  turnNumber,
  move1,
  move2,
  points1,
  points2
) {


  const row =
    document.createElement(
      "tr"
    );


  row.innerHTML = `

    <td>
      ${turnNumber}
    </td>

    <td>

      <span
        class="
          arena-move
          arena-move-${move1.toLowerCase()}
        "
      >
        ${move1}
      </span>

    </td>

    <td>

      <span
        class="
          arena-move
          arena-move-${move2.toLowerCase()}
        "
      >
        ${move2}
      </span>

    </td>

    <td>
      ${points1} – ${points2}
    </td>

  `;


  document.getElementById(
    "game-table"
  ).appendChild(
    row
  );

}



/* ======================================================
   CONSOLE
====================================================== */

function appendConsole(
  bot,
  text
) {


  const consoleBox =
    document.getElementById(
      "console-" + bot
    );


  consoleBox.textContent +=
    text;


  consoleBox.scrollTop =
    consoleBox.scrollHeight;

}



/* ======================================================
   FINE PARTITA
====================================================== */

function finishGame() {


  clearWatchdog();


  gameActive =
    false;



  const finalBox =
    document.getElementById(
      "final-result"
    );



  if (
    score1 > score2
  ) {


    finalBox.className =
      "arena-final victory";


    finalBox.innerHTML =

      "<strong>" +
      escapeHTML(
        botNames[1]
      ) +
      " vince!</strong>" +

      "<span>" +
      score1 +
      " – " +
      score2 +
      "</span>";

  }


  else if (
    score2 > score1
  ) {


    finalBox.className =
      "arena-final victory";


    finalBox.innerHTML =

      "<strong>" +
      escapeHTML(
        botNames[2]
      ) +
      " vince!</strong>" +

      "<span>" +
      score2 +
      " – " +
      score1 +
      "</span>";

  }


  else {


    finalBox.className =
      "arena-final draw";


    finalBox.innerHTML =

      "<strong>Pareggio!</strong>" +

      "<span>" +
      score1 +
      " – " +
      score2 +
      "</span>";

  }



  document.getElementById(
    "play-button"
  ).disabled =
    false;

}



/* ======================================================
   ERRORE
====================================================== */

function failGame(
  message
) {


  if (!gameActive) {


    const errorBox =
      document.getElementById(
        "error-box"
      );


    errorBox.textContent =
      message;


    errorBox.classList.remove(
      "hidden"
    );


    return;

  }



  gameActive =
    false;


  clearWatchdog();



  const errorBox =
    document.getElementById(
      "error-box"
    );


  errorBox.textContent =
    message;


  errorBox.classList.remove(
    "hidden"
  );



  /*
    In caso di errore fermiamo completamente
    entrambi i Worker.

    In questo modo anche un eventuale
    while infinito viene eliminato.
  */

  terminateWorkers();



  document.getElementById(
    "arena-status"
  ).textContent =
    "Riavvio dell'Arena...";



  setTimeout(
    createWorkers,
    400
  );

}



/* ======================================================
   TIMEOUT
====================================================== */

function armWatchdog() {


  clearWatchdog();


  watchdog =
    setTimeout(
      function() {


        if (!gameActive) {
          return;
        }



        let message =

          "La partita è stata fermata perché " +
          "uno dei bot non ha raggiunto il " +
          "prossimo input().";


        if (
          pendingMoves[1] &&
          !pendingMoves[2]
        ) {

          message +=

            "\\n\\n" +
            botNames[1] +
            " è pronto, ma " +
            botNames[2] +
            " sembra essere bloccato.";

        }


        else if (
          pendingMoves[2] &&
          !pendingMoves[1]
        ) {

          message +=

            "\\n\\n" +
            botNames[2] +
            " è pronto, ma " +
            botNames[1] +
            " sembra essere bloccato.";

        }


        message +=

          "\\n\\nControlla soprattutto i cicli while.";


        failGame(
          message
        );

      },

      BOT_TIMEOUT

    );

}



function clearWatchdog() {


  if (watchdog) {


    clearTimeout(
      watchdog
    );


    watchdog =
      null;

  }

}



/* ======================================================
   RESET
====================================================== */

function resetVisuals() {


  document.getElementById(
    "error-box"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "game-table"
  ).innerHTML =
    "";


  document.getElementById(
    "console-1"
  ).textContent =
    "";


  document.getElementById(
    "console-2"
  ).textContent =
    "";


  document.getElementById(
    "score-1"
  ).textContent =
    "0";


  document.getElementById(
    "score-2"
  ).textContent =
    "0";


  const finalBox =
    document.getElementById(
      "final-result"
    );


  finalBox.innerHTML =
    "";


  finalBox.className =
    "arena-final";

}



function resetArena() {


  clearWatchdog();


  gameActive =
    false;


  resetVisuals();


  document.getElementById(
    "results"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "console-section"
  ).classList.add(
    "hidden"
  );


  /*
    Ricreiamo i Worker:
    partita successiva completamente pulita.
  */

  createWorkers();

}



/* ======================================================
   TERMINA WORKER
====================================================== */

function terminateWorkers() {


  for (
    let bot = 1;
    bot <= 2;
    bot++
  ) {


    if (
      workers[bot]
    ) {


      workers[bot].terminate();


      workers[bot] =
        null;

    }

  }


  workersReady = {

    1: false,
    2: false

  };

}



/* ======================================================
   PULIZIA ERRORI PYTHON
====================================================== */

function cleanPythonError(
  message
) {


  /*
    Manteniamo per ora il traceback:
    è utile per capire gli errori
    degli studenti.
  */

  return String(
    message
  );

}



/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHTML(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



/* ======================================================
   EVENTI
====================================================== */

document.getElementById(
  "play-button"
).addEventListener(
  "click",
  playGame
);


document.getElementById(
  "reset-button"
).addEventListener(
  "click",
  resetArena
);



/* ======================================================
   AVVIO
====================================================== */

createWorkers();


</script>
