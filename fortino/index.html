<script type="module">

const PYODIDE_URL =
  "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.mjs";

const TURN_DELAY = 300;
const BOT_TIMEOUT = 8000;

const OPPONENT_NAME = "Fortino";

const OPPONENT_CODE = `
turno = 1

while turno <= 10:

    mossa = "P"

    print("Gioco:", mossa)

    mossa_avversario = input("Mossa avversario: ")

    turno = turno + 1
`;


const scores = {

  C: {
    C: [3, 3],
    A: [0, 5],
    P: [2, 1]
  },

  A: {
    C: [5, 0],
    A: [0, 0],
    P: [0, 2]
  },

  P: {
    C: [1, 2],
    A: [2, 0],
    P: [1, 1]
  }

};


const PYTHON_ENGINE = `

import ast

from arena_bridge import arena_input, arena_print


def __arena_print__(*args, sep=" ", end="\\n", file=None, flush=False):

    testo = sep.join(str(x) for x in args)
    testo = testo + end

    arena_print(testo)


async def __arena_input__(mossa_corrente, prompt=""):

    risposta = await arena_input(
        mossa_corrente,
        str(prompt)
    )

    return str(risposta)


class InputTransformer(ast.NodeTransformer):

    def visit_Call(self, node):

        node = self.generic_visit(node)

        if (
            isinstance(node.func, ast.Name)
            and node.func.id == "input"
        ):

            current_move = ast.Call(

                func=ast.Attribute(

                    value=ast.Call(
                        func=ast.Name(
                            id="locals",
                            ctx=ast.Load()
                        ),
                        args=[],
                        keywords=[]
                    ),

                    attr="get",
                    ctx=ast.Load()

                ),

                args=[
                    ast.Constant(value="mossa")
                ],

                keywords=[]

            )

            prompt = (
                node.args[0]
                if len(node.args) > 0
                else ast.Constant(value="")
            )

            new_call = ast.Call(

                func=ast.Name(
                    id="__arena_input__",
                    ctx=ast.Load()
                ),

                args=[
                    current_move,
                    prompt
                ],

                keywords=[]

            )

            return ast.copy_location(
                ast.Await(value=new_call),
                node
            )

        return node


async def run_student_code(source):

    tree = ast.parse(
        source,
        filename="<bot>"
    )

    tree = InputTransformer().visit(tree)

    main_function = ast.AsyncFunctionDef(

        name="__bot_main__",

        args=ast.arguments(
            posonlyargs=[],
            args=[],
            vararg=None,
            kwonlyargs=[],
            kw_defaults=[],
            kwarg=None,
            defaults=[]
        ),

        body=tree.body,

        decorator_list=[],

        returns=None,

        type_comment=None,

        type_params=[]

    )

    module = ast.Module(
        body=[main_function],
        type_ignores=[]
    )

    ast.fix_missing_locations(module)

    compiled = compile(
        module,
        filename="<bot>",
        mode="exec"
    )

    environment = {
        "__arena_input__": __arena_input__,
        "print": __arena_print__
    }

    exec(
        compiled,
        environment
    )

    await environment["__bot_main__"]()

`;


function createWorkerSource() {

  return `

    import {
      loadPyodide
    } from ${JSON.stringify(PYODIDE_URL)};

    let pyodide = null;
    let nextInputId = 0;

    const waitingInputs =
      new Map();


    function arenaPrint(text) {

      self.postMessage({
        type: "print",
        text: String(text)
      });

    }


    function arenaInput(move, prompt) {

      return new Promise(
        (resolve) => {

          nextInputId++;

          const id =
            nextInputId;

          waitingInputs.set(
            id,
            resolve
          );

          self.postMessage({

            type: "input",

            id: id,

            move:
              move === null ||
              move === undefined
                ? null
                : String(move),

            prompt:
              String(prompt || "")

          });

        }
      );

    }


    async function initialize() {

      try {

        pyodide =
          await loadPyodide();

        pyodide.registerJsModule(
          "arena_bridge",
          {
            arena_input: arenaInput,
            arena_print: arenaPrint
          }
        );

        await pyodide.runPythonAsync(
          ${JSON.stringify(PYTHON_ENGINE)}
        );

        self.postMessage({
          type: "ready"
        });

      }

      catch (error) {

        self.postMessage({
          type: "fatal",
          message: String(error.message || error)
        });

      }

    }


    initialize();


    self.onmessage =
      async function(event) {

        const data =
          event.data;


        if (
          data.type ===
          "input-response"
        ) {

          const resolve =
            waitingInputs.get(
              data.id
            );

          if (resolve) {

            waitingInputs.delete(
              data.id
            );

            resolve(
              data.value
            );

          }

          return;

        }


        if (
          data.type ===
          "start"
        ) {

          try {

            pyodide.globals.set(
              "_student_source",
              data.code
            );

            await pyodide.runPythonAsync(
              "await run_student_code(_student_source)"
            );

            self.postMessage({
              type: "done"
            });

          }

          catch (error) {

            self.postMessage({
              type: "error",
              message: String(error.message || error)
            });

          }

        }

      };

  `;

}


let workers = {
  student: null,
  opponent: null
};

let workerUrls = {
  student: null,
  opponent: null
};

let ready = {
  student: false,
  opponent: false
};

let pending = {
  student: null,
  opponent: null
};

let finished = {
  student: false,
  opponent: false
};

let gameActive = false;

let turn = 0;

let scoreStudent = 0;
let scoreOpponent = 0;

let studentName =
  "Il mio bot";

let watchdog = null;


function createWorkers() {

  terminateWorkers();

  ready = {
    student: false,
    opponent: false
  };

  document.getElementById(
    "play-button"
  ).disabled = true;

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    "Preparazione dei motori Python...";

  status.classList.remove(
    "ready"
  );


  for (
    const bot of ["student", "opponent"]
  ) {

    const blob =
      new Blob(
        [createWorkerSource()],
        {
          type: "text/javascript"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    workerUrls[bot] =
      url;

    const worker =
      new Worker(
        url,
        {
          type: "module"
        }
      );

    workers[bot] =
      worker;

    worker.onmessage =
      function(event) {

        handleWorkerMessage(
          bot,
          event.data
        );

      };

    worker.onerror =
      function(event) {

        failGame(
          "Errore nel motore Python.\n\n" +
          event.message
        );

      };

  }

}


function handleWorkerMessage(
  bot,
  data
) {

  if (
    data.type === "ready"
  ) {

    ready[bot] =
      true;

    if (
      ready.student &&
      ready.opponent
    ) {

      const status =
        document.getElementById(
          "status"
        );

      status.textContent =
        "Sfida pronta ✓";

      status.classList.add(
        "ready"
      );

      document.getElementById(
        "play-button"
      ).disabled = false;

    }

    return;

  }


  if (
    data.type === "print"
  ) {

    if (gameActive) {

      appendConsole(
        bot,
        data.text
      );

    }

    return;

  }


  if (
    data.type === "input"
  ) {

    if (!gameActive) {
      return;
    }

    receiveMove(
      bot,
      data.id,
      data.move,
      data.prompt
    );

    return;

  }


  if (
    data.type === "done"
  ) {

    if (!gameActive) {
      return;
    }

    finished[bot] =
      true;

    if (
      turn < 10
    ) {

      failGame(
        botLabel(bot) +
        " ha terminato il programma prima del turno 10."
      );

      return;

    }

    if (
      finished.student &&
      finished.opponent
    ) {

      finishGame();

    }

    return;

  }


  if (
    data.type === "error"
  ) {

    failGame(
      "Errore in " +
      botLabel(bot) +
      ":\n\n" +
      data.message
    );

    return;

  }


  if (
    data.type === "fatal"
  ) {

    failGame(
      "Errore nel caricamento Python:\n\n" +
      data.message
    );

  }

}


function receiveMove(
  bot,
  inputId,
  rawMove,
  prompt
) {

  if (
    turn >= 10
  ) {

    failGame(
      botLabel(bot) +
      " ha richiesto un nuovo input() dopo il turno 10."
    );

    return;

  }


  if (
    rawMove === null ||
    rawMove === undefined
  ) {

    failGame(
      botLabel(bot) +
      ' è arrivato a input() senza aver assegnato "mossa".'
    );

    return;

  }


  const move =
    String(rawMove)
      .trim()
      .toUpperCase();


  if (
    !["C", "A", "P"].includes(
      move
    )
  ) {

    failGame(
      botLabel(bot) +
      ' ha assegnato a "mossa" il valore "' +
      move +
      '".\n\nSono ammessi soltanto C, A e P.'
    );

    return;

  }


  if (
    prompt
  ) {

    appendConsole(
      bot,
      String(prompt)
    );

  }


  pending[bot] = {
    id: inputId,
    move: move
  };


  if (
    pending.student &&
    pending.opponent
  ) {

    completeTurn();

  }

}


function completeTurn() {

  clearWatchdog();

  const student =
    pending.student;

  const opponent =
    pending.opponent;

  pending = {
    student: null,
    opponent: null
  };

  turn++;

  const points =
    scores[
      student.move
    ][
      opponent.move
    ];

  const pStudent =
    points[0];

  const pOpponent =
    points[1];

  scoreStudent +=
    pStudent;

  scoreOpponent +=
    pOpponent;

  addTurnToTable(
    turn,
    student.move,
    opponent.move,
    pStudent,
    pOpponent
  );

  document.getElementById(
    "score-student"
  ).textContent =
    scoreStudent;

  document.getElementById(
    "score-opponent"
  ).textContent =
    scoreOpponent;


  appendConsole(
    "student",
    opponent.move + "\n"
  );

  appendConsole(
    "opponent",
    student.move + "\n"
  );


  setTimeout(
    function() {

      if (!gameActive) {
        return;
      }

      workers.student.postMessage({

        type:
          "input-response",

        id:
          student.id,

        value:
          opponent.move

      });

      workers.opponent.postMessage({

        type:
          "input-response",

        id:
          opponent.id,

        value:
          student.move

      });

      if (
        turn < 10
      ) {

        armWatchdog();

      }

      else {

        armFinishWatchdog();

      }

    },

    TURN_DELAY

  );

}


function playGame() {

  resetVisuals();

  studentName =
    document.getElementById(
      "student-name"
    ).value.trim()
    || "Il mio bot";

  const studentCode =
    document.getElementById(
      "student-code"
    ).value;

  document.getElementById(
    "console-name-student"
  ).textContent =
    studentName.toUpperCase();

  document.getElementById(
    "score-name-student"
  ).textContent =
    studentName.toUpperCase();

  document.getElementById(
    "table-student-name"
  ).textContent =
    studentName;

  gameActive =
    true;

  turn =
    0;

  scoreStudent =
    0;

  scoreOpponent =
    0;

  pending = {
    student: null,
    opponent: null
  };

  finished = {
    student: false,
    opponent: false
  };

  document.getElementById(
    "play-button"
  ).disabled = true;

  document.getElementById(
    "console-section"
  ).classList.remove(
    "hidden"
  );

  document.getElementById(
    "results"
  ).classList.remove(
    "hidden"
  );


  workers.student.postMessage({
    type: "start",
    code: studentCode
  });

  workers.opponent.postMessage({
    type: "start",
    code: OPPONENT_CODE
  });

  armWatchdog();

}


function addTurnToTable(
  turnNumber,
  moveStudent,
  moveOpponent,
  pStudent,
  pOpponent
) {

  const row =
    document.createElement(
      "tr"
    );

  row.innerHTML = `

    <td>
      ${turnNumber}
    </td>

    <td>
      <span class="move move-${moveStudent.toLowerCase()}">
        ${moveStudent}
      </span>
    </td>

    <td>
      <span class="move move-${moveOpponent.toLowerCase()}">
        ${moveOpponent}
      </span>
    </td>

    <td>
      ${pStudent} – ${pOpponent}
    </td>

  `;

  document.getElementById(
    "game-table"
  ).appendChild(
    row
  );

}


function finishGame() {

  if (!gameActive) {
    return;
  }

  clearWatchdog();

  gameActive =
    false;

  const box =
    document.getElementById(
      "final-result"
    );


  if (
    scoreStudent > scoreOpponent
  ) {

    box.className =
      "final victory";

    box.innerHTML =
      "<strong>Vittoria!</strong><br>" +
      escapeHTML(studentName) +
      " batte " +
      OPPONENT_NAME +
      " " +
      scoreStudent +
      " – " +
      scoreOpponent;

  }

  else if (
    scoreStudent < scoreOpponent
  ) {

    box.className =
      "final defeat";

    box.innerHTML =
      "<strong>Fortino vince.</strong><br>" +
      scoreStudent +
      " – " +
      scoreOpponent;

  }

  else {

    box.className =
      "final draw";

    box.innerHTML =
      "<strong>Pareggio!</strong><br>" +
      scoreStudent +
      " – " +
      scoreOpponent;

  }

  document.getElementById(
    "play-button"
  ).disabled = false;

}


function appendConsole(
  bot,
  text
) {

  const id =
    bot === "student"
      ? "console-student"
      : "console-opponent";

  const box =
    document.getElementById(
      id
    );

  box.textContent +=
    text;

  box.scrollTop =
    box.scrollHeight;

}


function botLabel(bot) {

  return bot === "student"
    ? studentName
    : OPPONENT_NAME;

}


function failGame(
  message
) {

  const box =
    document.getElementById(
      "error-box"
    );

  box.textContent =
    message;

  box.classList.remove(
    "hidden"
  );

  if (
    gameActive
  ) {

    gameActive =
      false;

    clearWatchdog();

    terminateWorkers();

    document.getElementById(
      "status"
    ).textContent =
      "Riavvio dei motori Python...";

    setTimeout(
      createWorkers,
      400
    );

  }

}


function armWatchdog() {

  clearWatchdog();

  watchdog =
    setTimeout(
      function() {

        if (!gameActive) {
          return;
        }

        failGame(
          "La partita è stata fermata perché uno dei due bot non ha raggiunto il prossimo input().\n\nControlla soprattutto i cicli while."
        );

      },
      BOT_TIMEOUT
    );

}


function armFinishWatchdog() {

  clearWatchdog();

  watchdog =
    setTimeout(
      function() {

        if (!gameActive) {
          return;
        }

        failGame(
          "Sono stati giocati 10 turni, ma uno dei programmi non è terminato correttamente."
        );

      },
      BOT_TIMEOUT
    );

}


function clearWatchdog() {

  if (
    watchdog !== null
  ) {

    clearTimeout(
      watchdog
    );

    watchdog =
      null;

  }

}


function resetVisuals() {

  document.getElementById(
    "error-box"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "error-box"
  ).textContent =
    "";

  document.getElementById(
    "console-student"
  ).textContent =
    "";

  document.getElementById(
    "console-opponent"
  ).textContent =
    "";

  document.getElementById(
    "game-table"
  ).innerHTML =
    "";

  document.getElementById(
    "score-student"
  ).textContent =
    "0";

  document.getElementById(
    "score-opponent"
  ).textContent =
    "0";

  const final =
    document.getElementById(
      "final-result"
    );

  final.innerHTML =
    "";

  final.className =
    "final";

}


function resetArena() {

  gameActive =
    false;

  clearWatchdog();

  resetVisuals();

  document.getElementById(
    "console-section"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "results"
  ).classList.add(
    "hidden"
  );

  createWorkers();

}


function terminateWorkers() {

  for (
    const bot of ["student", "opponent"]
  ) {

    if (
      workers[bot]
    ) {

      workers[bot].terminate();

      workers[bot] =
        null;

    }

    if (
      workerUrls[bot]
    ) {

      URL.revokeObjectURL(
        workerUrls[bot]
      );

      workerUrls[bot] =
        null;

    }

  }

  ready = {
    student: false,
    opponent: false
  };

}


function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


document.getElementById(
  "play-button"
).addEventListener(
  "click",
  playGame
);


document.getElementById(
  "reset-button"
).addEventListener(
  "click",
  resetArena
);


createWorkers();

</script>

</body>
</html>
